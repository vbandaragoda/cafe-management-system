services:
  mysql:
    image: mysql:8.4
    container_name: caffora-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-caffora}
      MYSQL_USER: ${DB_USERNAME:-caffora}
      MYSQL_PASSWORD: ${DB_PASSWORD:-caffora}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-caffora_root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - caffora-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-caffora_root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    volumes:
      - caffora-images:/app/uploads
    build: .
    container_name: caffora-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-caffora}
      DB_USERNAME: ${DB_USERNAME:-caffora}
      DB_PASSWORD: ${DB_PASSWORD:-caffora}
      DDL_AUTO: ${DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-key-before-deploying-to-prod-min-32-bytes}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@caffora.com}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-Admin@12345}
      ADMIN_SEED_NAME: ${ADMIN_SEED_NAME:-System Admin}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  caffora-images:
  caffora-mysql-data:
